<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <pattern id="halftone-frieren" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.2" fill="#FF3B6B" opacity="0.25"/>
    </pattern>
    <pattern id="screentone-dark" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#6E6A78" opacity="0.3"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="#0B0A0F"/>
  <rect width="800" height="600" fill="url(#screentone-dark)"/>
  
  <!-- Atmospheric Moon / Aura -->
  <circle cx="560" cy="220" r="180" fill="#FFC93C" opacity="0.9"/>
  <circle cx="560" cy="220" r="180" fill="url(#halftone-frieren)"/>
  
  <!-- Silhouette Landscape & Foliage -->
  <path d="M0,450 Q250,380 500,430 T800,420 L800,600 L0,600 Z" fill="#131219"/>
  <path d="M0,490 Q200,440 450,480 T800,470 L800,600 L0,600 Z" fill="#0B0A0F"/>
  
  <!-- Staves & Cloak Silhouette Motif -->
  <path d="M380,180 L440,480 L320,480 Z" fill="#F2EFE8" opacity="0.95"/>
  <circle cx="380" cy="140" r="32" fill="#F2EFE8"/>
  <!-- Staff with red gem -->
  <line x1="330" y1="100" x2="310" y2="490" stroke="#FF3B6B" stroke-width="8"/>
  <circle cx="330" cy="100" r="18" fill="#FF3B6B"/>
  <circle cx="330" cy="100" r="26" fill="none" stroke="#FFC93C" stroke-width="4"/>

  <!-- Manga Panel Framings -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#272433" stroke-width="3"/>
  <rect x="36" y="36" width="728" height="528" fill="none" stroke="#FF3B6B" stroke-width="1" stroke-dasharray="8 6" opacity="0.5"/>
  
  <!-- Screentone Title Plate -->
  <rect x="48" y="470" width="380" height="70" fill="#0B0A0F"/>
  <text x="64" y="504" fill="#F2EFE8" font-family="sans-serif" font-weight="900" font-size="28" letter-spacing="1">FRIEREN</text>
  <text x="64" y="528" fill="#FFC93C" font-family="sans-serif" font-weight="700" font-size="14" letter-spacing="2">MADHOUSE · BEYOND JOURNEY'S END</text>
</svg>
